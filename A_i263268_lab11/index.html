<!DOCTYPE html>
<!-- Zainab Abbasi 26i-3268 SE-A -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ADOPT ME!</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <h1>ADOPT ME!</h1>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="nav-link active">Home</a>
        <a href="pets.html" class="nav-link">Our Pets</a>
        <a href="contact.html" class="nav-link">Contact Us</a>
    </nav>

    <div class="banner-images">
        <img src="images/pet1.jpg" width="128" height="128" alt="Pet 1">
        <img src="images/pet2.jpg" width="128" height="128" alt="Pet 2">
        <img src="images/pet3.jpg" width="128" height="128" alt="Pet 3">
    </div>

    <!-- Pet 1 -->
    <div class="pet-card">
        <img src="images/final1.jpg" width="128" height="128" id="pic1" alt="Coco">  
        <table>
            <tr>
                <td>Name: Coco, </td>
                <td>Age: 2.5 years, </td>
                <td>Type: Dog</td>
            </tr>
        </table>
        <button class="button" id="button1" onclick="adoptme('Coco')">Adopt Me</button>
    </div>

    <!-- Pet 2 -->
    <div class="pet-card">
        <img src="images/final2.jpg" width="128" height="128" id="pic2" alt="Mimi">
        <table>
            <tr>
                <td>Name: Mimi, </td>
                <td>Age: 1.5 years, </td>
                <td>Type: Cat</td>
            </tr>
        </table>
        <button class="button" id="button2" onclick="adoptme('Mimi')">Adopt Me</button>
    </div>

    <!-- Pet 3 -->
    <div class="pet-card">
        <img src="images/final3.jpg" width="128" height="128" id="pic3" alt="Fifi">
        <table>
            <tr>
                <td>Name: Fifi, </td>
                <td>Age: 3 years, </td>
                <td>Type: Rabbit</td>
            </tr>
        </table>
        <button class="button" id="button3" onclick="adoptme('Fifi')">Adopt Me</button>
    </div>

    <script>
      function adoptme(petName) {
        console.log(petName + " adoption button was clicked");
        window.alert("You have adopted " + petName + "!");
      }
    </script>
</body>
</html>
